[auth]
additional_redirect_urls = ["https://yarika.online/**", "https://www.yarika.online/**", "http://localhost:8080/**", "http://localhost:8090/**"]
site_url = "https://yarika.online"

[auth.email]
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8


[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true

[functions.admin-create-host]
verify_jwt = false

[functions.search-listings]
verify_jwt = false

[functions.send-booking-confirmation]
verify_jwt = true

# Development utility: its own secret guard and ALLOW_DEMO_SEED gate are required.
[functions.seed-demo-users]
verify_jwt = false

[functions.cancel-expired-bookings]
verify_jwt = false

[functions.mark-completed-bookings]
verify_jwt = false

[functions.process-pending-payouts]
verify_jwt = false
