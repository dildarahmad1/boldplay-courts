  <body>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f4f7f7; }
      #yarika-startup {
        position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center;
        padding: 24px; background: #f4f7f7; color: #173e3d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #yarika-startup-card { width: min(100%, 360px); text-align: center; }
      #yarika-startup-mark { margin: 0 0 8px; font-size: 32px; font-weight: 700; letter-spacing: -.05em; }
      #yarika-startup-message { margin: 0; color: #536b6a; font-size: 15px; line-height: 1.6; }
      #yarika-startup-spinner { width: 30px; height: 30px; margin: 26px auto 0; border: 3px solid #d7e4e2; border-top-color: #176b66; border-radius: 50%; animation: yarika-spin .8s linear infinite; }
      #yarika-startup-retry { display: none; margin: 20px auto 0; border: 0; border-radius: 10px; padding: 11px 18px; background: #176b66; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      #yarika-startup.has-error #yarika-startup-spinner { display: none; }
      #yarika-startup.has-error #yarika-startup-retry { display: inline-block; }
      @keyframes yarika-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #yarika-startup-spinner { animation-duration: 2s; } }
    </style>
    <div id="yarika-startup" role="status" aria-live="polite">
      <div id="yarika-startup-card">
        <p id="yarika-startup-mark">Yarika</p>
        <p id="yarika-startup-message">Loading your courts…</p>
        <div id="yarika-startup-spinner" aria-hidden="true"></div>
        <button id="yarika-startup-retry" type="button" onclick="window.location.reload()">Reload site</button>
      </div>
    </div>
    <script>
      var startupLanguage = 'ckb';
      try { startupLanguage = localStorage.getItem('boldplay-language') || 'ckb'; } catch (_) {}
      var startupCopy = {"en": ["Loading your courts…", "The site could not finish loading. Check your connection and try again.", "This is taking longer than expected. Check your connection, then reload the site.", "Reload site"], "ar": ["جارٍ تحميل الملاعب…", "تعذر تحميل الموقع. تحقق من اتصالك وحاول مجددًا.", "يستغرق التحميل وقتًا أطول من المتوقع. تحقق من اتصالك وأعد تحميل الموقع.", "إعادة تحميل الموقع"], "ckb": ["یاریگاکانت بار دەکرێن…", "ماڵپەڕەکە بار نەکرا. پەیوەندییەکەت بپشکنە و دووبارە هەوڵ بدە.", "بارکردن زیاتر لە چاوەڕوانی دەخایەنێت. پەیوەندییەکەت بپشکنە و ماڵپەڕەکە نوێ بکەرەوە.", "ماڵپەڕ نوێ بکەرەوە"], "kmr": ["یاریگەهێن تە دهێنە بارکرن…", "ماڵپەڕ نەهاتە بارکرن. پەیوەندیا خۆ بپشکنە و دووبارە هەول بدە.", "بارکرن زێدەتر ژ چاڤەرێکرنێ دکێشیت. پەیوەندیا خۆ بپشکنە و ماڵپەڕی نوێ بکە.", "ماڵپەڕی نوێ بکە"]};
      var startupText = startupCopy[startupLanguage] || startupCopy.ckb;
      document.documentElement.lang = startupLanguage;
      document.documentElement.dir = startupLanguage === 'en' ? 'ltr' : 'rtl';
      document.getElementById('yarika-startup-message').textContent = startupText[0];
      document.getElementById('yarika-startup-retry').textContent = startupText[3];
      window.__yarikaStartupError = function (message) {
        var screen = document.getElementById('yarika-startup');
        var text = document.getElementById('yarika-startup-message');
        if (!screen || !text) return;
        screen.classList.add('has-error');
        screen.setAttribute('role', 'alert');
        text.textContent = message === 'This is taking longer than expected. Check your connection, then reload the site.' ? startupText[2] : startupText[1];
      };
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') window.__yarikaStartupError();
      }, true);
      window.setTimeout(function () {
        if (document.getElementById('yarika-startup')) {
          window.__yarikaStartupError('This is taking longer than expected. Check your connection, then reload the site.');
        }
      }, 15000);
    </script>
    <div id="root"></div>
